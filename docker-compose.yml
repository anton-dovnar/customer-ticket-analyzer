services:
  # 1. База данных (PostgreSQL)
  # Тут будут лежать сами тикеты и результаты анализа
  db:
    image: postgres:18-alpine
    container_name: ticket_db
    env_file: docker/db.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Кэш (Redis)
  # Чтобы не спрашивать ChatGPT об одном и том же дважды
  redis:
    image: redis:8.6-alpine
    container_name: ticket_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

# Брокер сообщений (Kafka)
  kafka:
    image: apache/kafka:4.1.2
    container_name: ticket_broker
    env_file: docker/kafka.env
    ports:
      - "9092:9092"
    restart: unless-stopped

  api_service:
    build:
      context: .
      dockerfile: services/api_service/Dockerfile
    container_name: ticket_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/ticket_system
    depends_on:
      - db
      - kafka
      - redis
    restart: unless-stopped

# Место на диске, чтобы данные в БД не стирались при перезагрузке
volumes:
  postgres_data:
