[project]
name = "customer-ticket-analyzer"
version = "0.1.0"
description = "AI Customer Support Analyzer"
requires-python = ">=3.14"
dependencies = [
  "ticket-service",
  "analysis-service",
  "ticket-shared",
]

[tool.uv.sources]
ticket-service = { workspace = true }
analysis-service = { workspace = true }
ticket-shared = { workspace = true }

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "faker==40.11.0",
  "ruff==0.15.7",
  "mypy==1.19.1",
  "pre-commit==4.5.1",
  "pip-audit==2.10.0",
]

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "strict"

[tool.ruff]
src = ["packages", "services"]
respect-gitignore = true
force-exclude = true
fix = true
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
future-annotations = true
extend-select = [
    "E",      # pycodestyle errors (style issues)
    "F",      # Pyflakes (code errors)
    "B",      # flake8-bugbear (bug prevention)
    "S",      # bandit (security issues)
    "RUF",    # ruff-specific rules
    "N",      # pep8-naming (naming conventions)
    "W",      # pycodestyle warnings
    "I",      # isort (import formatting)
    "T",      # flake8-print (print statements)
    "PERF",   # performance issues
    "PIE",    # flake8-pie (unnecessary code)
    "TID",    # flake8-tidy-imports (import best practices)
    "ASYNC",  # async/await best practices
    "RET",    # flake8-return (return improvements)
    "UP006",  # use collections.abc
    "UP007",  # use X | Y for unions
    "UP035",  # use dict/list instead of typing.Dict/List
    "UP037",  # remove quotes from type annotations
    "UP045",  # use X | None instead of Optional[X]
    "UP004",  # use isinstance instead of type
    "UP008",  # use super() instead of super(Class, self)
    "UP010",  # use isinstance for type checks
    "UP018",  # use str() instead of "string"
    "UP031",  # use f-strings for .format()
    "UP032",  # use f-strings for .format() with positional
    "I001",   # sort imports
    "I002",   # remove unused imports
]
ignore = ["E501"]  # ignore line too long globally

[tool.ruff.lint.isort]
no-sections = false
case-sensitive = true
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
known-first-party = ["ticket", "ticket_shared", "analysis"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"services/*/tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
python_version = "3.14"
mypy_path = "services/ticket"
files = [
  "packages/ticket_shared/ticket_shared",
  "services/ticket/ticket",
  "services/analysis/analysis",
]
exclude = "(?x)(^services/.*/tests/)"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
