[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-shared"
version = "0.1.0"
description = "Shared Kafka and HTTP contracts"
requires-python = ">=3.14"
dependencies = [
  "pydantic==2.12.5",
  "orjson==3.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ticket_shared"]
